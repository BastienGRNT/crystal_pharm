<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Le thème choisi est posé avant l'affichage, sans flash (cf. ui/src/theme).
			try {
				const rememberedTheme = localStorage.getItem('crystal-pharm-theme');
				if (rememberedTheme) document.documentElement.dataset.theme = rememberedTheme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<!-- La couleur principale de l’espace des groupements : le module « grp » du design system (la teinte de la colonne). -->
	<body data-sveltekit-preload-data="hover" data-module="grp">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
