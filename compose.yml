services:
  postgres:
    image: postgres:16
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

  # La passerelle devant `app/site` (lancé par `pnpm dev` sur le port 5177) : elle
  # demande à `pharmacy/host` (port 5173) à qui est chaque adresse, et garde les pages en cache.
  caddy:
    build: ./docker/caddy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SITE_GATEWAY_TOKEN: ${SITE_GATEWAY_TOKEN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/pages:/srv/pages:ro

volumes:
  postgres_data:
