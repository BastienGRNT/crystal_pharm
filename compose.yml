services:
  postgres:
    image: postgres:16
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

  # La passerelle devant `app/site` (lancé par `pnpm dev` sur le port 5177) : elle ne fait
  # que relayer les requêtes ; `app/site` résout l'adresse et garde ses pages en cache.
  caddy:
    image: caddy:2.11.7
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
