# Le déploiement Forge (prod = branche main, dev = branche develop). Le plan : docs/architecture.md.
# Les variables, une liste par VPS : env/production/{web,database,api}.env.example. Un serveur qui porte
# plusieurs VPS (le serveur de dev) reçoit les leurs, à la suite, dans son .env.
# Seule la passerelle publie un port ; le HTTPS est terminé par le proxy placé devant.
# APP_ENV absent = production. `APP_ENV=development` embarque l'outil de dev, envoie les emails dans la boîte
# de dev (COMPOSE_PROFILES=development-mailbox) et garde le faux PaymentProvider quelles que soient les clés.
# L'API C# ne lit pas APP_ENV : ses endpoints de dev (données de santé de démo) demandent
# `ASPNETCORE_ENVIRONMENT=Development`, absent = Production.
#
# Les fournisseurs restent dehors : stockage objet (R2…), Postgres et stockage objet HDS, envoi d'emails (TEM),
# stockage des sauvegardes. `make simulate` les remplace par des conteneurs (docker/simulation/).
#
# Un réseau par lien, comme entre les serveurs : seul `api` voit le monde HDS, et le Postgres du Node
# ne parle qu'aux apps Node, aux migrations et aux sauvegardes.

x-application-environment: &application_environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manque (web.env)}
  FILE_STORAGE_ENDPOINT: ${FILE_STORAGE_ENDPOINT:?FILE_STORAGE_ENDPOINT manque (web.env)}
  FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:-auto}
  FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:?FILE_STORAGE_BUCKET manque (web.env)}
  FILE_STORAGE_ACCESS_KEY_ID: ${FILE_STORAGE_ACCESS_KEY_ID:?FILE_STORAGE_ACCESS_KEY_ID manque}
  FILE_STORAGE_SECRET_ACCESS_KEY: ${FILE_STORAGE_SECRET_ACCESS_KEY:?FILE_STORAGE_SECRET_ACCESS_KEY manque}

x-svelte-environment: &svelte_environment
  <<: *application_environment
  PHARMACY_URL: ${PHARMACY_URL:?PHARMACY_URL manque (https://...)}
  GROUP_URL: ${GROUP_URL:?GROUP_URL manque (https://...)}
  ADMIN_URL: ${ADMIN_URL:?ADMIN_URL manque (https://...)}
  SITE_URL: ${SITE_URL:?SITE_URL manque (https://...)}
  SITE_PREVIEW_URL: ${SITE_PREVIEW_URL:?SITE_PREVIEW_URL manque (https://...)}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_ALLOW_PLAIN_TEXT: ${SMTP_ALLOW_PLAIN_TEXT:-false}
  DEVELOPMENT_MAILBOX_URL: http://mailpit:8025
  DEVELOPMENT_MAILBOX_SMTP_URL: smtp://mailpit:1025
  EMAIL_SENDER: ${EMAIL_SENDER:-Crystal Pharm <bonjour@crystal-pharm.fr>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  INVOICE_ISSUER_NAME: ${INVOICE_ISSUER_NAME:-Crystal Pharm}
  INVOICE_ISSUER_ADDRESS: ${INVOICE_ISSUER_ADDRESS:-Adresse à compléter}
  INVOICE_ISSUER_SIREN: ${INVOICE_ISSUER_SIREN:-à compléter}
  INVOICE_ISSUER_VAT_NUMBER: ${INVOICE_ISSUER_VAT_NUMBER:-à compléter}
  HOST: 0.0.0.0
  PORT: "3000"

x-svelte-healthcheck: &svelte_healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-build-mode: &build_mode ${APP_ENV:-production}

services:
  # ─── Le VPS du Postgres du Node ──────────────────────────────────────────────
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manque (database.env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque (database.env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manque (database.env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [node_database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # La base du Node et les fichiers du stockage objet, chiffrés, vers le stockage des sauvegardes.
  # Jamais de donnée de santé : leur sauvegarde est celle de l'hébergeur HDS.
  backup:
    build:
      context: .
      dockerfile: docker/prod/backup.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER manque (database.env)}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque (database.env)}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB manque (database.env)}
      FILE_STORAGE_ENDPOINT: ${FILE_STORAGE_ENDPOINT:?FILE_STORAGE_ENDPOINT manque (database.env)}
      FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:-auto}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:?FILE_STORAGE_BUCKET manque (database.env)}
      # Une clé en lecture seule sur le bucket des fichiers, distincte de celle des apps.
      BACKUP_FILES_ACCESS_KEY_ID: ${BACKUP_FILES_ACCESS_KEY_ID:?BACKUP_FILES_ACCESS_KEY_ID manque (clé en lecture seule du bucket des fichiers)}
      BACKUP_FILES_SECRET_ACCESS_KEY: ${BACKUP_FILES_SECRET_ACCESS_KEY:?BACKUP_FILES_SECRET_ACCESS_KEY manque}
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT:?BACKUP_STORAGE_ENDPOINT manque}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-auto}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:?BACKUP_STORAGE_BUCKET manque}
      BACKUP_STORAGE_ACCESS_KEY_ID: ${BACKUP_STORAGE_ACCESS_KEY_ID:?BACKUP_STORAGE_ACCESS_KEY_ID manque}
      BACKUP_STORAGE_SECRET_ACCESS_KEY: ${BACKUP_STORAGE_SECRET_ACCESS_KEY:?BACKUP_STORAGE_SECRET_ACCESS_KEY manque}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-production}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:?BACKUP_ENCRYPTION_PASSWORD manque (openssl rand -base64 32, gardé hors du serveur)}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-10}
    networks: [node_database, backup_outbound]
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Le VPS de Caddy et du Node ──────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/prod/migrate.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manque (web.env)}
    networks: [node_database]
    depends_on:
      postgres:
        condition: service_healthy

  pharmacy:
    build:
      context: .
      dockerfile: docker/prod/sveltekit.Dockerfile
      args:
        APP_DIRECTORY: pharmacy/host
        APP_PACKAGE: "@crystal-pharm/pharmacy"
        BUILD_MODE: *build_mode
    restart: unless-stopped
    environment:
      <<: *svelte_environment
      ORIGIN: ${PHARMACY_URL}
      API_URL: http://api:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manque (openssl rand -base64 32)}
      SITE_PREVIEW_MEDIA_SECRET: ${SITE_PREVIEW_MEDIA_SECRET:?SITE_PREVIEW_MEDIA_SECRET manque (openssl rand -base64 32)}
    networks: [gateway, node_database, api_link]
    healthcheck: *svelte_healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  group:
    build:
      context: .
      dockerfile: docker/prod/sveltekit.Dockerfile
      args:
        APP_DIRECTORY: group
        APP_PACKAGE: "@crystal-pharm/group"
        BUILD_MODE: *build_mode
    restart: unless-stopped
    environment:
      <<: *svelte_environment
      ORIGIN: ${GROUP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    networks: [gateway, node_database]
    healthcheck: *svelte_healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: docker/prod/sveltekit.Dockerfile
      args:
        APP_DIRECTORY: admin
        APP_PACKAGE: "@crystal-pharm/admin"
        BUILD_MODE: *build_mode
    restart: unless-stopped
    environment:
      <<: *svelte_environment
      ORIGIN: ${ADMIN_URL}
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?PLATFORM_AUTH_SECRET manque (openssl rand -base64 32)}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:?PLATFORM_ADMIN_EMAILS manque}
    networks: [gateway, node_database]
    healthcheck: *svelte_healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  site:
    build:
      context: .
      dockerfile: docker/prod/site.Dockerfile
    restart: unless-stopped
    environment:
      <<: *application_environment
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: ${SITE_URL:?SITE_URL manque (https://...)}
      PHARMACY_URL: ${PHARMACY_URL}
      API_URL: http://api:8080
      SiteService__ApiKey: ${SiteService__ApiKey:?SiteService__ApiKey manque (web.env)}
      SITE_PREVIEW_MEDIA_SECRET: ${SITE_PREVIEW_MEDIA_SECRET}
    networks: [gateway, node_database, api_link]
    healthcheck: *svelte_healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    entrypoint: ["/usr/local/bin/caddy-entrypoint.sh"]
    environment:
      PHARMACY_URL: ${PHARMACY_URL}
      GROUP_URL: ${GROUP_URL}
      ADMIN_URL: ${ADMIN_URL}
      SITE_URL: ${SITE_URL}
      SITE_PREVIEW_URL: ${SITE_PREVIEW_URL}
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/prod/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
    networks: [gateway]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - pharmacy
      - group
      - admin
      - site

  # La boîte de dev, seulement sur le serveur de dev (COMPOSE_PROFILES=development-mailbox, avec APP_ENV=development) :
  # les emails y arrivent au lieu de partir, l'outil de dev les lit.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    profiles: [development-mailbox]
    networks: [gateway]

  # ─── Le VPS du C# ────────────────────────────────────────────────────────────
  # Ses données de santé sont chez l'hébergeur HDS (Postgres managé et stockage objet), joints par le réseau `hds`.
  api:
    build:
      context: .
      dockerfile: docker/prod/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApplyMigrationsAtStartup: "true"
      # Le propriétaire des schémas, le temps de migrer ; l'API tourne ensuite avec un rôle ordinaire, soumis à la RLS.
      ConnectionStrings__HealthMigrations: ${ConnectionStrings__HealthMigrations:?ConnectionStrings__HealthMigrations manque (api.env)}
      ConnectionStrings__Booking: ${ConnectionStrings__Booking:?ConnectionStrings__Booking manque (api.env)}
      ConnectionStrings__Prescriptions: ${ConnectionStrings__Prescriptions:?ConnectionStrings__Prescriptions manque (api.env)}
      PrescriptionStorage__ServiceUrl: ${PrescriptionStorage__ServiceUrl:?PrescriptionStorage__ServiceUrl manque (le point d'accès S3 HDS)}
      PrescriptionStorage__PublicServiceUrl: ${PrescriptionStorage__PublicServiceUrl:-}
      PrescriptionStorage__Region: ${PrescriptionStorage__Region:-}
      PrescriptionStorage__BucketName: ${PrescriptionStorage__BucketName:?PrescriptionStorage__BucketName manque}
      PrescriptionStorage__AccessKeyId: ${PrescriptionStorage__AccessKeyId:?PrescriptionStorage__AccessKeyId manque}
      PrescriptionStorage__SecretAccessKey: ${PrescriptionStorage__SecretAccessKey:?PrescriptionStorage__SecretAccessKey manque}
      SiteService__ApiKey: ${SiteService__ApiKey:?SiteService__ApiKey manque (api.env)}
      ManagerJwt__JwksUrl: http://pharmacy:3000/api/auth/jwks
      ManagerJwt__AllowPlainHttpJwksUrl: "true"
      ManagerJwt__Issuer: ${ManagerJwt__Issuer:?ManagerJwt__Issuer manque (api.env, PHARMACY_URL de web.env)}
      ManagerJwt__Audience: crystal-pharm-api
    networks: [api_link, hds]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # Caddy et les apps Node ; aussi leur sortie vers le stockage objet, l'envoi d'emails et le paiement.
  gateway:
  # Le Postgres du Node : jamais de sortie vers Internet.
  node_database:
    internal: true
  # Les appelants du C# (pharmacy, site) : jamais de sortie vers Internet.
  api_link:
    internal: true
  # Le C# et l'hébergeur HDS : aucun service Node n'y est.
  hds:
  # Les sauvegardes vers leur stockage.
  backup_outbound:

volumes:
  postgres_data:
